# Read-only verification: lint + a UAT-mode static build.
#
# `uat` is the shared staging branch; `main` is production. This workflow only
# reports a check run — it never merges, opens PRs, or writes to any branch.
# Iris's connector merges `iris/*` into `uat` after the requester confirms, and
# opens the `uat` -> `main` release PR when an admin asks; a human merges it.
# Vercel's deploy hook is separate from GitHub Actions and fires on the push.

name: CI

on:
  push:
    branches: ['iris/**', 'uat']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
        # `next build` typechecks and catches static-export violations.
        # VERCEL_GIT_COMMIT_REF=uat exercises the UAT branch of src/lib/site.ts.
      - run: npm run build
        env:
          VERCEL_GIT_COMMIT_REF: uat
